name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # English CLI output, so the vulnerability check below can match it.
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  backend:
    name: Backend (build, unit and integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/GroceryList.UnitTests --no-build --configuration Release

      # Testcontainers starts SQL Server 2022 in Docker, which ubuntu-latest runners provide.
      - name: Integration tests
        run: dotnet test tests/GroceryList.IntegrationTests --no-build --configuration Release

  vulnerability-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # The command exits 0 even when it finds vulnerabilities, so fail on its output instead.
      - name: List vulnerable packages (direct and transitive)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)."
            exit 1
          fi

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
