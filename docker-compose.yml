services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: grocerylist-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: grocerylist-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Production environment: no Development appsettings, no exception details in responses.
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GroceryListDb: "Server=sqlserver,1433;Database=GroceryList;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (see .env.example)}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Database__ApplyMigrationsOnStartup: "true"
      # Demo only: exposes the OpenAPI document and the Scalar UI at http://localhost:8080/scalar so
      # reviewers can try the API. A real production deployment would leave this disabled (the default).
      OpenApi__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  sqlserver-data:
